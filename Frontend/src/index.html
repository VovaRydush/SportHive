<style>
/* Фон, який затемнює сторінку */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    
    /* Саме модальне вікно */
    .modal-container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    
    /* Кнопка закриття */
    .modal-close {
        margin-top: 10px;
        padding: 5px 10px;
        cursor: pointer;
    }
